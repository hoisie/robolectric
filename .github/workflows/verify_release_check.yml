# Throwaway: the release workflow's check-staged steps against the published 4.18-beta-1.
name: Verify release check on arm64

on:
  push:
    branches: [ verify-release-check-arm64 ]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version-file: .github/.java-version
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        if: matrix.os == 'ubuntu-24.04-arm'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Run the release check project against the published version
        shell: bash
        run: ./gradlew -p .github/release-check test --stacktrace "-ProbolectricVersion=4.18-beta-1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ matrix.os }}
          path: .github/release-check/build/test-results/**/TEST-*.xml
