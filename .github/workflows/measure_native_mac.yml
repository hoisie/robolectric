# Throwaway: finds where testReplacementFontMetricsTest spends 12 s per SDK on macOS.
name: Measure native tests on macOS

on:
  push:
    branches: [ measure-native-tests ]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version-file: .github/.java-version
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Hostname lookups
        run: |
          hostname; scutil --get LocalHostName || true
          cat > /tmp/H.java <<'J'
          public class H { public static void main(String[] a) throws Exception {
            for (int i = 0; i < 3; i++) { long t = System.nanoTime();
              System.out.println(java.net.InetAddress.getLocalHost() + " " + (System.nanoTime() - t) / 1000000 + " ms"); } } }
          J
          java /tmp/H.java
      - name: Build
        env: { SKIP_ERRORPRONE: true, SKIP_JAVADOC: true }
        run: ./gradlew :integration_tests:nativegraphics:compileDebugUnitTestJavaWithJavac -q
      - name: Run the slow test with thread dumps
        env: { SKIP_ERRORPRONE: true, SKIP_JAVADOC: true }
        run: |
          ( while true; do sleep 2
              for p in $(jps -l | awk '/GradleWorkerMain|Gradle Test Executor/ {print $1}'); do
                echo "=== $(date +%T) $p"; jstack "$p" | awk '/^"(SDK [0-9]+ Main Thread|Test worker)"/,/^$/'; done
            done ) > dumps.txt 2>&1 &
          ./gradlew :integration_tests:nativegraphics:testDebugUnitTest --tests '*ShadowNativeStaticLayoutTest.testReplacementFontMetricsTest*' \
            -Drobolectric.alwaysIncludeVariantMarkersInTestName=true -Drobolectric.enabledSdks=33,34 --rerun || true
          kill %1 || true
          python3 - <<'P'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("integration_tests/nativegraphics/build/test-results/**/TEST-*.xml", recursive=True):
              for t in ET.parse(f).getroot().iter("testcase"): print("RESULT", t.get("name"), t.get("time"))
          P
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dumps
          path: dumps.txt
